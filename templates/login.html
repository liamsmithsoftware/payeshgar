{% extends "base.html" %}
{% block title %}ورود | پایشگر{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-icon">📡</div>
    <h2 style="text-align:center;font-size:22px;font-weight:900">ورود به پایشگر</h2>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin:8px 0 22px">نام کاربری، رمز عبور و کپچا را وارد کنید</p>

    <form method="POST" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
      <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
      <div class="field">
        <label>نام کاربری</label>
        <input type="text" name="username" required autocomplete="username" placeholder="مثلاً admin">
      </div>
      <div class="field">
        <label>رمز عبور</label>
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="field">
        <label>کپچا — حاصل عبارت زیر را بنویسید</label>
        <div class="captcha-box">
          <span class="captcha-q">{{ captcha_q }}</span>
          <span style="color:var(--muted)">=</span>
          <input type="text" name="captcha" required inputmode="numeric" placeholder="؟" style="flex:1">
          <button type="button" class="btn btn-ghost btn-sm" onclick="location.reload()" title="کپچای جدید">🔄</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">ورود 🔑</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted)">بازگشت به <a href="{{ url_for('landing') }}">صفحه اصلی</a></p>
  </div>
</div>
{% endblock %}
